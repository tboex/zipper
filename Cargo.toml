[package]
name = "zipper"
version = "0.1.0"
edition = "2021"
description = "Streaming gzip compression and decompression, as a CLI and Rust library"
license = "MIT"
readme = "README.md"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
